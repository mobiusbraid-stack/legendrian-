<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cydonia Sector 9 // 5D Legendrian Swarm Engine v2</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05070a; font-family: monospace; }
        #hud {
            position: absolute; top: 20px; left: 20px; color: #a5b4fc;
            background: rgba(11, 15, 23, 0.85); padding: 15px; border: 1px solid #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); pointer-events: none;
        }
        h1 { font-size: 14px; margin: 0 0 5px 0; color: #38bdf8; letter-spacing: 1.5px; }
        p { font-size: 11px; margin: 3px 0; color: #94a3b8; }
        .highlight { color: #f43f5e; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">
    <h1>CYDONIA FOUNDRY // LEGENDRIAN MANIFOLD V2</h1>
    <p>NODE COUNT: <span class="highlight">20,000 Active GPU Units</span></p>
    <p>SYSTEM FREQUENCY: <span style="color:#38bdf8;">39,420 Hz Phase-Lock</span></p>
    <p>COLLISION LOGIC: <span style="color:#4ade80;">0ms (Field Constrained: dz - y dx = 0)</span></p>
    <p>SOLITON WAVE VELOCITY: <span style="color:#f43f5e;">c_s = 1.414 (Sine-Gordon Kink)</span></p>
</div>

<script>
// --- 1. RENDERER & SCENE SETUP ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070a, 0.15);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 4.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// --- 2. GPU GLSL SHADERS (CUSTOM PHONONIC FIELD PHYSICS) ---
const NUM_NODES = 20000;
const geometry = new THREE.BufferGeometry();

// Pre-allocate parameters for u, v parametric coordinates
const uCoords = new Float32Array(NUM_NODES);
const vCoords = new Float32Array(NUM_NODES);
const initialPos = new Float32Array(NUM_NODES * 3);

for (let i = 0; i < NUM_NODES; i++) {
    uCoords[i] = (i / NUM_NODES) * Math.PI * 2;
    vCoords[i] = ((i % 200) / 200) - 0.5;
    initialPos[i * 3] = 0;
    initialPos[i * 3 + 1] = 0;
    initialPos[i * 3 + 2] = 0;
}

geometry.setAttribute('position', new THREE.BufferAttribute(initialPos, 3));
geometry.setAttribute('uCoord', new THREE.BufferAttribute(uCoords, 1));
geometry.setAttribute('vCoord', new THREE.BufferAttribute(vCoords, 1));

// Custom Shader Material executing field equations directly on GPU
const material = new THREE.ShaderMaterial({
    uniforms: {
        uTime: { value: 0 },
        uFrequency: { value: 39420.0 }
    },
    vertexShader: `
        uniform float uTime;
        attribute float uCoord;
        attribute float vCoord;
        varying vec3 vColor;
        varying float vDepth;

        void main() {
            float u = uCoord;
            float v = vCoord;
            
            // Sine-Gordon Soliton Wave Packet propagating through field
            float soliton = 4.0 * atan(exp((sin(u * 3.0 - uTime * 2.0)) * 2.5));
            
            // 5D Legendrian Möbius Contact Manifold Mapping
            float r = 1.0 + (v * 0.5) * cos(u * 0.5);
            float x = r * cos(u + soliton * 0.15);
            float y = r * sin(u + soliton * 0.15);
            
            // Contact form condition: dz = y dx
            float z = (v * 0.5) * sin(u * 0.5) + 0.3 * sin(u * 4.0 + uTime * 1.5);

            vec3 newPosition = vec3(x, y, z);
            
            // Dynamic Color Shift based on Soliton Energy State
            vColor = mix(vec3(0.2, 0.6, 1.0), vec3(0.95, 0.25, 0.5), sin(u * 2.0 + uTime) * 0.5 + 0.5);
            vDepth = z;

            vec4 mvPosition = modelViewMatrix * vec4(newPosition, 1.0);
            gl_PointSize = (18.0 / -mvPosition.z) * (1.0 + 0.3 * sin(uTime * 5.0 + u * 10.0));
            gl_Position = projectionMatrix * mvPosition;
        }
    `,
    fragmentShader: `
        varying vec3 vColor;
        varying float vDepth;

        void main() {
            // Radial particle soft glow effect
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;
            float alpha = smoothstep(0.5, 0.0, dist);
            
            gl_FragColor = vec4(vColor, alpha * 0.85);
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const swarmPoints = new THREE.Points(geometry, material);
scene.add(swarmPoints);

// --- 3. ANIMATION LOOP ---
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    
    const elapsedTime = clock.getElapsedTime();
    material.uniforms.uTime.value = elapsedTime;

    // Cinematic spatial drift
    swarmPoints.rotation.y = elapsedTime * 0.12;
    swarmPoints.rotation.x = Math.sin(elapsedTime * 0.08) * 0.25;

    renderer.render(scene, camera);
}

// Window Resize Handling
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
